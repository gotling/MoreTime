; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Unit tests run on the computer, see env:native
test_ignore = *
; MD_MAX72xx always emits an informational #warning about which SPI interface it uses
build_flags = -Wno-cpp
lib_deps = 
	majicdesigns/MD_Parola@^3.7.1
	jsware/AbleButtons@^0.4.0
	contrem/arduino-timer@^3.0.1
	tzapu/WiFiManager@^2.0.17
	ESP8266WiFi
	; 256dpi/MQTT@^2.5.1
	bblanchon/ArduinoJson@^6.21.3

; Unit tests for the mode logic, run with: pio test -e native
; Only hardware independent libraries are built, test/fakes stands in for the rest.
[env:native]
platform = native
test_framework = unity
lib_ldf_mode = off
lib_deps =
	Format
	Mode
	Timer
	Chess
	Rice
	Counter
	StopWatch
	throwtheswitch/Unity@^2.6.1
build_flags = -std=gnu++17 -I test/fakes
